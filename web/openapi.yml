            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryRegion'
          description: ''
    patch:
      operationId: api_admin_delivery_regions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this delivery region.
        required: true
      tags:
      - api
