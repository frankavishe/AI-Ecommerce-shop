        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDeliveryRegionList'
          description: ''
    post:
      operationId: api_admin_delivery_regions_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDeliveryRegionRequest'
          application/x-www-form-urlencoded:
