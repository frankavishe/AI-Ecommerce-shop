        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDeliveryRegionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminDeliveryRegionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDeliveryRegionRequest'
        required: true
      security:
      - jwtAuth: []
