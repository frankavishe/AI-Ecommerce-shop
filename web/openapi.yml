              $ref: '#/components/schemas/AdminDeliveryRegionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryRegion'
          description: ''
  /api/admin/delivery-regions/{id}/:
    get:
      operationId: api_admin_delivery_regions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this delivery region.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryRegion'
          description: ''
    put:
      operationId: api_admin_delivery_regions_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this delivery region.
        required: true
      tags:
      - api
