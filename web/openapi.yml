        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/orders/:
    get:
      operationId: api_admin_orders_list
      description: Render service-layer ShopErrors as {"detail", "code", ...extra}.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: paid
        schema:
          type: boolean
      - in: query
        name: placed_after
        schema:
          type: string
          format: date
      - in: query
        name: placed_before
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - awaiting_payment
          - cancelled
          - delivered
          - expired
          - needs_review
          - out_for_delivery
          - paid
          - processing
        description: |-
          * `awaiting_payment` - Awaiting payment
          * `paid` - Paid
          * `processing` - Processing
          * `out_for_delivery` - Out for delivery
          * `delivered` - Delivered
          * `cancelled` - Cancelled
          * `expired` - Expired
          * `needs_review` - Needs review
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderSummaryList'
          description: ''
