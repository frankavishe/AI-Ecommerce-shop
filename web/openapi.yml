        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminDeliveryRegionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminDeliveryRegionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminDeliveryRegionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeliveryRegion'
          description: ''
