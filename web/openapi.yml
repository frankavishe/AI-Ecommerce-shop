components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - product_id
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 50
        region:
          type: string
          maxLength: 80
        district:
          type: string
          maxLength: 80
        street:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
      required:
      - id
      - region
      - street
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        region:
          type: string
          minLength: 1
          maxLength: 80
        district:
          type: string
          maxLength: 80
        street:
          type: string
          minLength: 1
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
      required:
      - region
      - street
    AdminDeliveryRegion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - fee
      - id
      - name
    AdminDeliveryRegionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - fee
      - name
    AdminOrder:
      type: object
      properties:
        number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        contact_email:
          type: string
          format: email
          readOnly: true
          description: Needed for card payments
        region:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        street:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderEvent'
          readOnly: true
        payment_url:
          type: string
          nullable: true
          readOnly: true
        user:
          type: string
          readOnly: true
        reminder_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/AdminPayment'
          readOnly: true
      required:
      - contact_email
      - contact_name
      - contact_phone
      - currency
      - delivery_fee
      - district
      - events
      - expires_at
      - items
      - notes
      - number
      - paid_at
      - payment_url
      - payments
      - placed_at
      - region
      - reminder_sent_at
      - status
      - street
      - subtotal
      - total
      - user
    AdminOrderEvent:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        source:
          $ref: '#/components/schemas/SourceEnum'
        note:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          readOnly: true
      required:
      - actor
      - created_at
      - source
      - status
    AdminOrderSummary:
      type: object
      properties:
        number:
          type: string
          maxLength: 12
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          readOnly: true
        placed_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        contact_name:
          type: string
          maxLength: 120
        contact_phone:
          type: string
          pattern: ^\+[1-9]\d{7,14}$
          maxLength: 16
        region:
          type: string
          maxLength: 80
      required:
      - contact_name
      - contact_phone
      - currency
      - number
      - region
      - total
    AdminPayment:
      type: object
      properties:
        reference:
          type: string
          description: Our reference, sent to Stakaba as metadata.orderId
          maxLength: 20
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        checkout_link:
          type: string
          format: uri
          maxLength: 500
        provider_ref:
          type: string
          description: Stakaba internalReference
          maxLength: 100
        channel:
          type: string
          description: Mobile money network
          maxLength: 60
        receipt:
          type: string
          description: Operator receipt (providerReference), quoted in disputes
          maxLength: 100
        collected_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - reference
      - updated_at
    Cart:
      type: object
      description: Renders services.cart_totals(cart).
      properties:
        token:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - item_count
      - items
      - subtotal
      - token
    CartLine:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/CartProduct'
        quantity:
          type: integer
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - line_total
      - product
      - quantity
      - unit_price
    CartProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price in TZS
        stock:
          type: integer
