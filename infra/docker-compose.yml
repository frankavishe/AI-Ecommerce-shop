# App box: run from repo root with
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
name: ai-shop

x-backend: &backend
  build: ../backend
  env_file: ../.env
  environment:
    DATABASE_URL: postgres://shop:shop@db:5432/shop
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    # AI endpoints (003): .env holds the localhost URLs for running Django outside docker. Inside the
    # containers, Ollama on the host is host.docker.internal and SigLIP is the `siglip` service
    # (start it with --profile ai). Override with the *_DOCKER vars, e.g. for a GPU box.
    AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    AI_VISION_BASE_URL: ${AI_VISION_BASE_URL_DOCKER:-}
    AI_EMBED_BASE_URL: ${AI_EMBED_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    AI_IMAGE_EMBED_URL: ${AI_IMAGE_EMBED_URL_DOCKER:-http://siglip:8090}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ../backend:/app
    - media:/app/media

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      DJANGO_API_URL: http://api:8000
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  siglip:
    # Image embeddings for photo search (CPU). Not started by default:
    #   docker compose -f infra/docker-compose.yml --profile ai up -d siglip
    profiles: ["ai"]
    build: ../ai/siglip
    environment:
      SIGLIP_API_KEY: ${SIGLIP_API_KEY:-}
    ports:
      - "8090:8090"
    volumes:
      - hf_cache:/models

volumes:
  pgdata:
  media:
  web_node_modules:
  hf_cache:
